name: pme_gestion_pro
description: Gestion centralisee multi-activites, multi-boutiques (FCFA).
publish_to: "none"
version: 1.8.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  intl: ^0.20.3
  # Médias : photos produits, logo, cachet, signature manuscrite
  image_picker: ^1.0.7
  path_provider: ^2.1.3
  signature: ^5.4.0
  # Variables d'environnement (credentials dans .env — jamais commité)
  flutter_dotenv: ^5.1.0
  # Client HTTP pour l'API REST backend/
  http: ^1.2.1
  # Backend sans serveur : Supabase (base + auth + images, tier gratuit)
  supabase_flutter: ^2.5.6
  # Offline-first : file d'attente locale + détection de réseau
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3
  # Export PDF documents (partage WhatsApp, impression)
  printing: ^5.12.0
  pdf: ^3.10.7
  # Partage de fichiers (CSV, sauvegardes) et sélecteur de fichiers
  share_plus: ^13.0.0
  file_picker: ^12.0.0
  # Session chiffrée (keystore téléphone)
  flutter_secure_storage: ^11.1.1
  # Notifications locales intelligentes (stock, budgets, rappels)
  flutter_local_notifications: ^17.0.0
  # Graphiques statistiques (courbes, barres, camemberts)
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Génère l'icône de l'application (Android/iOS/Web) à partir d'une seule
  # image source — voir la section flutter_launcher_icons ci-dessous.
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    # Seul le fichier réellement chargé par Image.asset() en Dart (écran de
    # connexion) doit être déclaré ici : le kit de marque complet sous
    # assets/images/nycta/ (SVG, EPS, JPG par variante, favicons, licence
    # police) n'est utile qu'à la génération de l'icône ci-dessous — le
    # déclarer en entier aurait embarqué ~1 Mo de fichiers inutiles dans
    # l'APK/IPA.
    - assets/images/nycta/couleur-fond-clair/nycta-icone.png

# Icône de l'application (Android/iOS/Web), générée à partir du symbole
# NYCTA seul (fond transparent, marge déjà intégrée dans le PNG source —
# voir assets/images/nycta/LIRE-MOI.txt) plutôt que de la composition
# horizontale avec le lettrage, illisible une fois réduite en icône.
# Couleurs de la charte (LIRE-MOI.txt) : accent vert menthe #10B981,
# structure bleu nuit #0F172A.
# À exécuter après `flutter pub get` :
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/images/nycta/couleur-fond-clair/nycta-icone.png"
  # Bleu nuit de la charte derrière le symbole vert menthe pour l'icône
  # adaptative Android (sans "adaptive_icon_foreground" séparé,
  # flutter_launcher_icons réutilise image_path pour le premier plan).
  adaptive_icon_background: "#0F172A"
  min_sdk_android: 21
  remove_alpha_ios: true
