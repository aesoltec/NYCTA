include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
    - use_key_in_widget_constructors
